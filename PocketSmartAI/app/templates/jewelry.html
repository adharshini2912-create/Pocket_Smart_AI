{% extends 'base.html' %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="form-card wide"><h1>Jewelry Budget Planner</h1><form id="jewelryForm" enctype="multipart/form-data"><label>Budget (INR)<input name="budget" type="number" min="1" required></label><label>Occasion<input name="occasion" placeholder="Wedding / Birthday / College event" required></label><label>Style<input name="style" value="elegant"></label><label>Outfit color<input name="outfit_color" value="not specified"></label><label>Preferences<textarea name="preferences" placeholder="Gold tone, minimal, statement..."></textarea></label><label>Optional outfit image<input name="outfit_image" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="btn">Generate recommendations</button></form><div id="result"></div></section>{% endblock %}
